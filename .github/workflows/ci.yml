name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Emacs version
        id: emacs-version
        run: echo "version=$(tr -d '[:space:]' < .emacs-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ steps.emacs-version.outputs.version }}

      - name: Run checks (indentation, lint, tests)
        run: |
          ./scripts/check-all.sh

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ["30.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile and run ERT tests
        run: |
          FSRS_DIR="$(./scripts/check-deps.sh)"
          emacs --batch -Q -L "$FSRS_DIR" -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile decklet*.el
          find . -name '*.elc' ! -path './scripts/.cache/*' -delete
          ./scripts/check-ert.sh
